<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#160a2e">
<title>AI or Real — Futures</title>
<style>
  @font-face{font-family:'Gal Gothic';src:url('assets/fonts/GalGothic-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Gal Gothic';src:url('assets/fonts/GalGothic-Light.woff2') format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Rhymes Display';src:url('assets/fonts/RhymesDisplay-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
  @font-face{font-family:'Rhymes Display';src:url('assets/fonts/RhymesDisplay-LightItalic.woff2') format('woff2');font-weight:300;font-style:italic;font-display:swap}
  :root{
    --copper:#c45236; --orange:#ff8432; --pink:#e444b9; --violet:#5d1fec; --sky:#62b4ff;
    --lemon:#ffff5f; --ginger:#ac9b25; --sage:#c5c6a4; --gray:#50482e;
    --ai:#5d1fec; --real:#ff8432;
    --ink:#fff; --dim:rgba(255,255,255,.66);
    --sans:'Gal Gothic',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --serif:'Rhymes Display',Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans); color:var(--ink);
    background:radial-gradient(130% 90% at 50% -10%, #3a1360 0%, #200a3f 45%, #100522 100%);
    min-height:100dvh; overflow-x:hidden; -webkit-user-select:none; user-select:none;
  }
  /* animated brand sunburst */
  .rays{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
  .rays::before{
    content:""; position:absolute; left:50%; top:-10%; width:260vmax; height:260vmax;
    transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,
      rgba(255,132,50,.14) 0deg 5deg, transparent 5deg 11deg,
      rgba(228,68,185,.11) 11deg 16deg, transparent 16deg 22deg);
    animation:spin 140s linear infinite; opacity:.55;
  }
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .wrap{position:relative; z-index:1; min-height:100dvh; display:flex; flex-direction:column; padding:16px 18px 26px; max-width:520px; margin:0 auto}
  .topbar{display:flex; align-items:center; gap:10px}
  .topbar img{height:22px; width:auto; opacity:.95}
  .conn{margin-left:auto; font-size:11px; color:var(--dim); display:flex; align-items:center; gap:6px; letter-spacing:.04em; text-transform:uppercase}
  .conn .pip{width:7px;height:7px;border-radius:50%;background:var(--lemon);box-shadow:0 0 10px var(--lemon)}
  .conn.bad .pip{background:var(--orange);box-shadow:0 0 10px var(--orange)}
  .center{flex:1; display:flex; flex-direction:column; justify-content:center}
  /* title lockup */
  .title{margin:4px 0 6px; line-height:.9}
  .title .a{font-family:var(--sans); font-weight:400; font-size:clamp(40px,13vw,60px); letter-spacing:-.02em; display:block}
  .title .b{font-family:var(--serif); font-style:italic; font-weight:300; font-size:clamp(50px,17vw,78px); line-height:.85;
    background:linear-gradient(100deg,var(--orange),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; display:block}
  .kicker{display:inline-block; font-size:11px; font-weight:400; letter-spacing:.22em; text-transform:uppercase; color:var(--lemon);
    border:1px solid rgba(255,255,95,.4); padding:5px 12px; border-radius:999px}
  .sub{color:var(--dim); font-size:15px; line-height:1.5; margin-top:14px}
  input.name{width:100%;margin-top:20px;padding:17px 18px;border-radius:15px;border:1.5px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.07);color:#fff;font-size:19px;font-weight:400;font-family:var(--sans);outline:none}
  input.name:focus{border-color:var(--orange);background:rgba(255,255,255,.12)}
  input.name::placeholder{color:rgba(255,255,255,.42)}
  .btn{width:100%;margin-top:14px;padding:18px;border:none;border-radius:15px;font-size:18px;font-weight:400;font-family:var(--sans);color:#fff;letter-spacing:.01em;
    background:linear-gradient(100deg,var(--violet),var(--pink));box-shadow:0 14px 34px -10px var(--pink);cursor:pointer;transition:transform .08s}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.5}
  .tiny{font-size:12px;color:var(--dim);margin-top:16px;text-align:center;line-height:1.5}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:24px 20px;text-align:center;backdrop-filter:blur(8px)}
  .pill{display:inline-block;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.1);font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .qtext{font-family:var(--serif);font-weight:300;font-size:clamp(21px,6vw,27px);line-height:1.34;margin:16px 6px 4px}
  .qimg{width:100%;border-radius:14px;margin:16px 0 2px;display:block;border:1px solid rgba(255,255,255,.14)}
  .votes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
  .vote{position:relative;overflow:hidden;padding:30px 10px 24px;border-radius:20px;border:none;font-family:var(--sans);font-size:27px;font-weight:400;letter-spacing:.02em;cursor:pointer;transition:transform .08s,filter .1s;color:#fff}
  .vote small{display:block;font-size:11px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;opacity:.9;margin-top:6px}
  .vote.ai{background:linear-gradient(160deg,#7a45ff,#4a15c6);box-shadow:0 12px 30px -10px var(--violet)}
  .vote.real{background:linear-gradient(160deg,#ff9a4d,#e2560f);box-shadow:0 12px 30px -10px var(--orange)}
  .vote .ray{position:absolute;top:-30%;right:-10%;width:90px;height:90px;opacity:.28;
    background:conic-gradient(from 200deg at 50% 50%, #fff 0 8deg, transparent 8deg 20deg, #fff 20deg 28deg, transparent 28deg 46deg, #fff 46deg 54deg, transparent 54deg 90deg)}
  .vote:active{transform:scale(.97)}
  .vote[disabled]{opacity:.4;filter:grayscale(.3)}
  .timer{font-size:14px;color:var(--dim);margin-top:18px;font-weight:400;letter-spacing:.04em}
  .result-emoji{font-size:56px;line-height:1;margin-bottom:6px}
  .verdict{font-family:var(--serif);font-style:italic;font-weight:300;font-size:36px;margin:2px 0}
  .verdict.good{color:var(--lemon)}.verdict.bad{color:var(--pink)}
  .pts{font-size:21px;font-weight:400;color:var(--lemon);margin-top:4px}
  .scorebar{margin-top:22px;font-size:14px;color:var(--dim)}
  .scorebar b{color:#fff;font-size:17px}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.22);border-top-color:var(--orange);animation:sp 1s linear infinite;margin:16px auto 0}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .foot{position:relative;z-index:1;text-align:center;font-size:11px;color:rgba(255,255,255,.36);margin-top:18px;letter-spacing:.05em}
</style>
</head>
<body>
<div class="rays"></div>
<div class="wrap">
  <div class="topbar">
    <img src="assets/futures-wordmark-white.png" alt="Futures Church">
    <span class="conn" id="conn"><span class="pip"></span><span id="connTxt">live</span></span>
  </div>
  <div class="center" id="app"></div>
  <div class="foot">Keep this open — your score is tracked automatically</div>
</div>

<script src="config.js"></script>
<script>
const H = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };
async function sbGet(path){ const r = await fetch(SUPABASE_URL+"/rest/v1/"+path, {headers:H}); if(!r.ok) throw new Error("get "+r.status); return r.json(); }
async function sbRpc(fn, body){ const r = await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn, {method:"POST",headers:H,body:JSON.stringify(body||{})}); if(!r.ok) throw new Error("rpc "+r.status); return r.json(); }
async function sbInsert(table, row){ const r = await fetch(SUPABASE_URL+"/rest/v1/"+table, { method:"POST", headers:{...H,"Prefer":"return=representation"}, body:JSON.stringify(row) }); return r; }

const LS = {
  get player(){ try{return JSON.parse(localStorage.getItem("air_player"))}catch(e){return null} },
  set player(v){ localStorage.setItem("air_player", JSON.stringify(v)) },
  get answers(){ try{return JSON.parse(localStorage.getItem("air_answers"))||{}}catch(e){return {}} },
  set answers(v){ localStorage.setItem("air_answers", JSON.stringify(v)) }
};
let player = LS.player;
let answers = LS.answers;
let state = {phase:"lobby",current_round:0,round_started_at:null};
let lastRenderKey = "";
let submitting = false;

function myScore(){ return Object.values(answers).reduce((s,a)=>s+(a.points||0),0); }
function roundByN(n){ return ROUNDS.find(r=>r.n===n); }
const app = document.getElementById("app");
function h(html){ app.innerHTML = html; }
function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];})}

/* ---------- JOIN ---------- */
function renderJoin(){
  if(lastRenderKey==="join") return;
  lastRenderKey="join";
  h(`
    <div class="fade">
      <span class="kicker">Dream Team Game</span>
      <h1 class="title"><span class="a">AI or</span><span class="b">Real?</span></h1>
      <p class="sub">Pop in your name, then out-smart the crowd. Right answers <b style="color:#fff">and</b> speed both score points.</p>
      <input class="name" id="nm" maxlength="24" placeholder="Your name" autocomplete="off" enterkeyhint="go">
      <button class="btn" id="joinBtn">Let's go →</button>
      <div class="tiny">500 legends. One leaderboard. No pressure.</div>
    </div>`);
  const nm=document.getElementById("nm"), b=document.getElementById("joinBtn");
  nm.focus();
  const go=async()=>{
    const name=(nm.value||"").trim();
    if(name.length<1){ nm.focus(); return; }
    b.disabled=true; b.textContent="Joining…";
    try{
      const r=await sbInsert("air_players",{name});
      const data=await r.json();
      if(!r.ok||!data[0]) throw new Error("join failed");
      player={id:data[0].id,name}; LS.player=player;
      lastRenderKey=""; render();
    }catch(e){
      b.disabled=false; b.textContent="Let's go →";
      alert("Hmm, couldn't join — check signal and tap again.");
    }
  };
  b.onclick=go;
  nm.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}

/* ---------- LOBBY ---------- */
function renderLobby(){
  const key="lobby"; if(lastRenderKey===key) return; lastRenderKey=key;
  h(`
    <div class="card fade">
      <div class="result-emoji">🎉</div>
      <div class="verdict good">You're in!</div>
      <p class="sub" style="margin-top:8px">Nice one, <b style="color:#fff">${esc(player.name)}</b>.<br>Eyes on the big screen — we're about to start.</p>
      <div class="spin"></div>
    </div>`);
}

/* ---------- QUESTION ---------- */
function renderQuestion(){
  const round=roundByN(state.current_round);
  if(!round){ renderLobby(); return; }
  const answered=answers[round.n];
  const key="q"+round.n+(answered?"-done":"-open");
  if(lastRenderKey===key) return;      // already showing this exact state
  lastRenderKey=key;

  const body = round.type==="image"
    ? `<img class="qimg" src="${round.img}" alt="Round ${round.n}" onerror="this.style.display='none'">`
    : `<div class="qtext">“${esc(round.text)}”</div>`;

  if(answered){
    h(`
      <div class="card fade">
        <div class="pill">Round ${round.n} · Locked in ✓</div>
        <div class="result-emoji">🔒</div>
        <div class="verdict">Locked</div>
        <p class="sub" style="margin-top:6px">You said <b style="color:#fff;text-transform:uppercase">${answered.choice}</b>. Hang tight for the reveal…</p>
        <div class="scorebar">Your score: <b>${myScore().toLocaleString()}</b></div>
      </div>`);
    return;
  }

  h(`
    <div class="fade">
      <div class="card" style="padding:18px 16px">
        <div class="pill">Round ${round.n} · ${esc(round.label)}</div>
        ${body}
      </div>
      <div class="votes">
        <button class="vote ai" id="vAi"><span class="ray"></span>AI<small>generated</small></button>
        <button class="vote real" id="vReal"><span class="ray"></span>REAL<small>a human made it</small></button>
      </div>
      <div class="timer" id="timer">Tap your answer!</div>
    </div>`);
  document.getElementById("vAi").onclick=()=>submit(round,"ai");
  document.getElementById("vReal").onclick=()=>submit(round,"real");
  startTimer();
}

let timerRAF=null;
function startTimer(){
  cancelAnimationFrame(timerRAF);
  const started = state.round_started_at ? new Date(state.round_started_at).getTime() : Date.now();
  const total = TIMER_SECONDS*1000;
  const tick=()=>{
    const el=document.getElementById("timer");
    if(!el) return;
    const left=Math.max(0, total-(Date.now()-started));
    const s=Math.ceil(left/1000);
    el.textContent = left>0 ? ("⏱ "+s+"s — faster = more points") : "Time's nearly up — lock it in!";
    timerRAF=requestAnimationFrame(tick);
  };
  tick();
}

async function submit(round, choice){
  if(submitting || answers[round.n]) return;
  submitting=true;
  const started = state.round_started_at ? new Date(state.round_started_at).getTime() : Date.now();
  const ms = Math.max(0, Date.now()-started);
  const correct = choice===round.answer;
  const points = scoreFor(correct, ms);
  answers[round.n]={choice,correct,points}; LS.answers=answers;
  lastRenderKey=""; renderQuestion();
  submitting=false;
  for(let i=0;i<4;i++){
    try{
      const r=await sbInsert("air_answers",{player_id:player.id,round:round.n,choice,is_correct:correct,points,ms_taken:ms});
      if(r.ok || r.status===409) return;
    }catch(e){}
    await new Promise(res=>setTimeout(res,700));
  }
}

/* ---------- REVEAL ---------- */
function renderReveal(){
  const round=roundByN(state.current_round);
  if(!round){ renderLobby(); return; }
  const key="rev"+round.n; if(lastRenderKey===key) return; lastRenderKey=key;
  const a=answers[round.n];
  const answerLabel = round.answer.toUpperCase();
  if(!a){
    h(`
      <div class="card fade">
        <div class="pill">Round ${round.n} · Reveal</div>
        <div class="result-emoji">${round.answer==="ai"?"🤖":"📷"}</div>
        <div class="verdict">It was ${answerLabel}</div>
        <p class="sub" style="margin-top:6px">You sat this one out — jump on the next!</p>
        <div class="scorebar">Your score: <b>${myScore().toLocaleString()}</b></div>
      </div>`);
    return;
  }
  h(`
    <div class="card fade">
      <div class="pill">Round ${round.n} · Reveal</div>
      <div class="result-emoji">${a.correct?"✅":"❌"}</div>
      <div class="verdict ${a.correct?"good":"bad"}">${a.correct?"Correct!":"Not this time"}</div>
      <p class="sub" style="margin-top:4px">It was <b style="color:#fff">${answerLabel}</b>. You guessed <b style="color:#fff;text-transform:uppercase">${a.choice}</b>.</p>
      ${a.correct?`<div class="pts">+${a.points.toLocaleString()} pts</div>`:``}
      <div class="scorebar">Your score: <b>${myScore().toLocaleString()}</b></div>
    </div>`);
}

/* ---------- END ---------- */
function renderEnd(){
  const key="end"; if(lastRenderKey===key) return; lastRenderKey=key;
  h(`
    <div class="card fade">
      <div class="result-emoji">🏆</div>
      <div class="verdict good">That's a wrap!</div>
      <p class="sub" style="margin-top:6px">Final scores are on the big screen.</p>
      <div class="scorebar" style="margin-top:18px">You finished with</div>
      <div class="pts" style="font-size:34px;margin-top:2px">${myScore().toLocaleString()} pts</div>
      <p class="tiny" style="margin-top:18px">Thanks for playing, ${esc(player.name)}. You're a legend.</p>
    </div>`);
}

function render(){
  if(!player){ renderJoin(); return; }
  switch(state.phase){
    case "question": renderQuestion(); break;
    case "reveal": renderReveal(); break;
    case "leaderboard":
    case "finished": renderEnd(); break;
    default: renderLobby();
  }
}

const conn=document.getElementById("conn"), connTxt=document.getElementById("connTxt");
let fails=0;
async function poll(){
  try{
    const rows=await sbGet("air_state?id=eq.1&select=phase,current_round,round_started_at");
    if(rows&&rows[0]){
      const s=rows[0];
      const changed = s.phase!==state.phase || s.current_round!==state.current_round || s.round_started_at!==state.round_started_at;
      state=s;
      if(changed){ lastRenderKey=""; }
      render();
    }
    fails=0; conn.classList.remove("bad"); connTxt.textContent="live";
  }catch(e){
    fails++; if(fails>=2){ conn.classList.add("bad"); connTxt.textContent="reconnecting"; }
  }
}

render();
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
