<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#160a2e">
<title>AI or Real — Futures</title>
<style>
  @font-face{font-family:'Gal Gothic';src:url('assets/fonts/GalGothic-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Rhymes Display';src:url('assets/fonts/RhymesDisplay-LightItalic.woff2') format('woff2');font-weight:300;font-style:italic;font-display:swap}
  :root{
    --orange:#ff8432; --pink:#e444b9; --violet:#5d1fec; --sky:#62b4ff; --lemon:#ffff5f;
    --ink:#fff; --dim:rgba(255,255,255,.66);
    --sans:'Gal Gothic',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --serif:'Rhymes Display',Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);color:var(--ink);
    background:radial-gradient(130% 90% at 50% -10%, #3a1360 0%, #200a3f 45%, #100522 100%);
    min-height:100dvh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
  .rays{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .rays::before{content:"";position:absolute;left:50%;top:-10%;width:260vmax;height:260vmax;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,rgba(255,132,50,.14) 0deg 5deg,transparent 5deg 11deg,rgba(228,68,185,.11) 11deg 16deg,transparent 16deg 22deg);
    animation:spin 140s linear infinite;opacity:.5}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .wrap{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px 24px;max-width:540px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:10px}
  .topbar img{height:20px;opacity:.95}
  .conn{margin-left:auto;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;letter-spacing:.04em;text-transform:uppercase}
  .conn .pip{width:7px;height:7px;border-radius:50%;background:var(--lemon);box-shadow:0 0 10px var(--lemon)}
  .conn.bad .pip{background:var(--orange);box-shadow:0 0 10px var(--orange)}
  .center{flex:1;display:flex;flex-direction:column;justify-content:center}
  .title{margin:4px 0 6px;line-height:.9}
  .title .a{font-family:var(--sans);font-weight:400;font-size:clamp(38px,12vw,56px);letter-spacing:-.02em;display:block}
  .title .b{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(48px,16vw,74px);line-height:.85;
    background:linear-gradient(100deg,var(--orange),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
  .kicker{display:inline-block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--lemon);border:1px solid rgba(255,255,95,.4);padding:5px 12px;border-radius:999px}
  .sub{color:var(--dim);font-size:15px;line-height:1.5;margin-top:14px}
  input.name{width:100%;margin-top:20px;padding:17px 18px;border-radius:15px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font-size:19px;font-family:var(--sans);outline:none}
  input.name:focus{border-color:var(--orange);background:rgba(255,255,255,.12)}
  input.name::placeholder{color:rgba(255,255,255,.42)}
  .btn{width:100%;margin-top:14px;padding:18px;border:none;border-radius:15px;font-size:18px;font-family:var(--sans);color:#fff;
    background:linear-gradient(100deg,var(--violet),var(--pink));box-shadow:0 14px 34px -10px var(--pink);cursor:pointer;transition:transform .08s}
  .btn:active{transform:scale(.98)}.btn[disabled]{opacity:.5}
  .tiny{font-size:12px;color:var(--dim);margin-top:16px;text-align:center;line-height:1.5}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px 16px;text-align:center;backdrop-filter:blur(8px)}
  .pill{display:inline-block;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .pill.blitz{background:rgba(255,255,95,.2);color:var(--lemon)}
  .pill.sudden{background:rgba(255,80,70,.25);color:#ffb3ab}
  .qprompt{font-size:clamp(17px,4.6vw,20px);font-weight:400;line-height:1.3;margin:12px 4px 0}
  .qbody{font-family:var(--serif);font-weight:300;font-size:clamp(17px,4.8vw,21px);line-height:1.4;margin:12px 2px 2px;white-space:pre-wrap;color:#fff}
  .qimg{width:100%;border-radius:14px;margin:14px 0 2px;display:block;border:1px solid rgba(255,255,255,.16)}
  .audionote{margin:14px 0 2px;font-size:15px;color:var(--lemon)}
  /* options */
  .opts{display:grid;gap:12px;margin-top:16px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts.one{grid-template-columns:1fr}
  .opt{position:relative;display:flex;align-items:center;gap:10px;justify-content:center;text-align:center;padding:20px 12px;border:none;border-radius:16px;font-family:var(--sans);font-size:17px;color:#fff;cursor:pointer;transition:transform .08s,filter .1s;line-height:1.2}
  .opts.one .opt{justify-content:flex-start;text-align:left;padding:16px 16px;font-size:16px}
  .opt .ltr{flex:none;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:400}
  .opt.c0{background:linear-gradient(160deg,#7a45ff,#4a15c6)}
  .opt.c1{background:linear-gradient(160deg,#ff9a4d,#e2560f)}
  .opt.c2{background:linear-gradient(160deg,#ef5fc6,#c31e8f)}
  .opt.c3{background:linear-gradient(160deg,#6fbcff,#2f7fd6)}
  .opt:active{transform:scale(.97)}.opt[disabled]{opacity:.4;filter:grayscale(.3)}
  /* tap grid */
  .tapwrap{position:relative;margin-top:14px}
  .tapgrid{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px}
  .tapz{border:2px dashed rgba(255,255,255,.35);border-radius:12px;background:rgba(0,0,0,.05);color:#fff;font-family:var(--sans);font-size:20px;display:flex;align-items:flex-start;justify-content:flex-start;padding:8px;cursor:pointer}
  .tapz span{background:rgba(0,0,0,.45);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .tapz:active{background:rgba(255,255,255,.18)}
  .tiphint{font-size:13px;color:var(--dim);margin-top:8px}
  /* image-pick: 2-4 tappable photo tiles */
  .imgopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .imgopt{position:relative;border:2px solid rgba(255,255,255,.16);border-radius:14px;overflow:hidden;padding:0;background:rgba(255,255,255,.06);cursor:pointer;aspect-ratio:1/1}
  .imgopt img{display:block;width:100%;height:100%;object-fit:cover}
  .imgopt .ltr{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:7px;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--sans)}
  .imgopt .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);font-size:12px;color:#fff;text-align:left;font-family:var(--sans)}
  .imgopt:active{transform:scale(.97)}
  .imgopt[disabled]{opacity:.4;filter:grayscale(.3)}
  .timer{font-size:14px;color:var(--dim);margin-top:16px;letter-spacing:.03em}
  .result-emoji{font-size:54px;line-height:1;margin-bottom:6px}
  .verdict{font-family:var(--serif);font-style:italic;font-weight:300;font-size:34px;margin:2px 0}
  .verdict.good{color:var(--lemon)}.verdict.bad{color:var(--pink)}
  .verdict.dead{color:#ff9a90}
  .pts{font-size:21px;color:var(--lemon);margin-top:4px}
  .scorebar{margin-top:20px;font-size:14px;color:var(--dim)}.scorebar b{color:#fff;font-size:17px}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.22);border-top-color:var(--orange);animation:sp 1s linear infinite;margin:16px auto 0}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .foot{position:relative;z-index:1;text-align:center;font-size:11px;color:rgba(255,255,255,.36);margin-top:16px}
  .dead-screen{filter:grayscale(1) brightness(.6)}
</style>
</head>
<body>
<div class="rays"></div>
<div class="wrap">
  <div class="topbar">
    <img src="assets/futures-wordmark-white.png" alt="Futures Church">
    <span class="conn" id="conn"><span class="pip"></span><span id="connTxt">live</span></span>
  </div>
  <div class="center" id="app"></div>
  <div class="foot">Keep this open — your score is tracked automatically</div>
</div>

<script src="config.js?v=7"></script>
<script>
const H = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };
async function sbGet(p){ const r=await fetch(SUPABASE_URL+"/rest/v1/"+p,{headers:H}); if(!r.ok) throw new Error("get "+r.status); return r.json(); }
async function sbInsert(t,row){ return fetch(SUPABASE_URL+"/rest/v1/"+t,{method:"POST",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(row)}); }

const LS = {
  get player(){ try{return JSON.parse(localStorage.getItem("air_player"))}catch(e){return null} },
  set player(v){ localStorage.setItem("air_player", JSON.stringify(v)) },
  get answers(){ try{return JSON.parse(localStorage.getItem("air_answers"))||{}}catch(e){return {}} },
  set answers(v){ localStorage.setItem("air_answers", JSON.stringify(v)) }
};
let player=LS.player, answers=LS.answers;
function forgetMe(){
  player=null; answers={}; lastRenderKey="";
  localStorage.removeItem("air_player"); localStorage.removeItem("air_answers");
  Object.keys(shownAt).forEach(k=>delete shownAt[k]);
}
let state={phase:"lobby",current_round:0,round_started_at:null};
let lastRenderKey="", submitting=false;
const shownAt={};   // round n -> when THIS phone first displayed it (immune to clock skew)
function myScore(){ return Object.values(answers).reduce((s,a)=>s+(a.points||0),0); }
function roundByN(n){ return ROUNDS.find(r=>r.n===n); }
const app=document.getElementById("app");
function h(html){ app.innerHTML=html; }
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
const LETTERS=["A","B","C","D","E"];

/* ---------- JOIN ---------- */
function renderJoin(){
  if(lastRenderKey==="join") return; lastRenderKey="join";
  h(`<div class="fade">
      <span class="kicker">Dream Team Game</span>
      <h1 class="title"><span class="a">AI or</span><span class="b">Real?</span></h1>
      <p class="sub">Pop in your name, then out-smart the crowd. Right answers <b style="color:#fff">and</b> speed both score points.</p>
      <input class="name" id="nm" maxlength="24" placeholder="Your name" autocomplete="off" enterkeyhint="go">
      <button class="btn" id="joinBtn">Let's go →</button>
      <div class="tiny">500 legends. One leaderboard. No pressure.</div>
    </div>`);
  const nm=document.getElementById("nm"), b=document.getElementById("joinBtn");
  nm.focus();
  const go=async()=>{
    const name=(nm.value||"").trim(); if(!name) return;
    b.disabled=true; b.textContent="Joining…";
    try{ const r=await sbInsert("air_players",{name}); const d=await r.json();
      if(!r.ok||!d[0]) throw 0; player={id:d[0].id,name,session:state.session_id}; LS.player=player; lastRenderKey=""; render();
    }catch(e){ b.disabled=false; b.textContent="Let's go →"; alert("Couldn't join — check signal and tap again."); }
  };
  b.onclick=go; nm.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
}

function renderLobby(){
  if(lastRenderKey==="lobby") return; lastRenderKey="lobby";
  h(`<div class="card fade"><div class="result-emoji">🎉</div><div class="verdict good">You're in!</div>
      <p class="sub" style="margin-top:8px">Nice one, <b style="color:#fff">${esc(player.name)}</b>.<br>Eyes on the big screen — we're about to start.</p>
      <div class="spin"></div></div>`);
}

/* ---------- QUESTION ---------- */
function modeBadge(r){
  if(r.mode==="blitz") return `<span class="pill blitz">⚡ Blitz</span>`;
  if(r.mode==="sudden_death") return `<span class="pill sudden">💀 Sudden Death</span>`;
  return "";
}
function mediaBlock(r){
  if(r.media_type==="image") return `<img class="qimg" src="${roundImage(r)}" alt="Round ${r.n}" onerror="this.style.display='none'">`;
  if(r.media_type==="audio") return `<div class="audionote">🔊 Listen on the big screen</div>`;
  return "";
}
function renderQuestion(){
  const r=roundByN(state.current_round);
  if(!r){ renderLobby(); return; }
  const answered=answers[r.n];
  const key="q"+r.n+(answered?"-done":"-open");
  if(lastRenderKey===key) return; lastRenderKey=key;
  if(!answered && !shownAt[r.n]) shownAt[r.n]=Date.now();
  document.body.classList.remove("dead-screen");

  if(answered){
    h(`<div class="card fade"><div class="pill">Round ${r.n} · Locked in ✓</div>
        <div class="result-emoji">🔒</div><div class="verdict">Locked</div>
        <p class="sub" style="margin-top:6px">You chose <b style="color:#fff">${esc(pickLabel(r,answered.i))}</b>. Hang tight for the reveal…</p>
        <div class="scorebar">Your score: <b>${myScore().toLocaleString()}</b></div></div>`);
    return;
  }

  if(r.interaction==="tapgrid"){
    h(`<div class="fade">
        <div class="card">
          <div class="pill">Round ${r.n} · ${esc(r.label)} ${modeBadge(r)}</div>
          <div class="qprompt">${esc(r.prompt)}</div>
          <div class="tapwrap">
            <img class="qimg" src="${roundImage(r)}" alt="Round ${r.n}">
            <div class="tapgrid">
              ${[0,1,2,3].map(i=>`<button class="tapz" data-i="${i}"><span>${LETTERS[i]}</span></button>`).join("")}
            </div>
          </div>
          <div class="tiphint">Tap the quadrant you think is the glitch</div>
        </div>
        <div class="timer" id="timer"></div></div>`);
    app.querySelectorAll(".tapz").forEach(z=>z.onclick=()=>submit(r,parseInt(z.dataset.i)));
  } else if(r.interaction==="imgpick"){
    const cards = r.options.map((o,i)=>`<button class="imgopt" data-i="${i}">
        <span class="ltr">${LETTERS[i]}</span>
        <img src="${esc(r.option_images[i]||'')}" alt="${esc(o)}" onerror="this.style.opacity='.15'">
        <span class="cap">${esc(o)}</span>
      </button>`).join("");
    h(`<div class="fade">
        <div class="card">
          <div class="pill">Round ${r.n} · ${esc(r.label)} ${modeBadge(r)}</div>
          <div class="qprompt">${esc(r.prompt)}</div>
        </div>
        <div class="imgopts">${cards}</div>
        <div class="timer" id="timer">Tap the real one!</div></div>`);
    app.querySelectorAll(".imgopt").forEach(b=>b.onclick=()=>submit(r,parseInt(b.dataset.i)));
  } else {
    const cols = r.options.length<=2 ? "two":"one";
    const opts = r.options.map((o,i)=>`<button class="opt c${i}" data-i="${i}"><span class="ltr">${LETTERS[i]}</span>${esc(o)}</button>`).join("");
    h(`<div class="fade">
        <div class="card">
          <div class="pill">Round ${r.n} · ${esc(r.label)} ${modeBadge(r)}</div>
          <div class="qprompt">${esc(r.prompt)}</div>
          ${r.content?`<div class="qbody">${esc(r.content)}</div>`:``}
          ${mediaBlock(r)}
        </div>
        <div class="opts ${cols}">${opts}</div>
        <div class="timer" id="timer">Tap your answer!</div></div>`);
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>submit(r,parseInt(b.dataset.i)));
  }
  startTimer(r);
}
function pickLabel(r,i){
  if(r.interaction==="tapgrid") return ["Top-Left","Top-Right","Bottom-Left","Bottom-Right"][i]||("Option "+LETTERS[i]);
  return r.options[i]!=null ? r.options[i] : ("Option "+LETTERS[i]);
}

let timerRAF=null;
function startTimer(r){
  cancelAnimationFrame(timerRAF);
  const started=state.round_started_at?new Date(state.round_started_at).getTime():Date.now();
  const total=roundTimer(r)*1000;
  const tick=()=>{ const el=document.getElementById("timer"); if(!el) return;
    const left=Math.max(0,total-(Date.now()-started)); const s=Math.ceil(left/1000);
    el.textContent = left>0 ? ("⏱ "+s+"s — faster = more points") : "Time's nearly up — lock it in!";
    timerRAF=requestAnimationFrame(tick); };
  tick();
}

async function submit(r, idx){
  if(submitting || answers[r.n]) return; submitting=true;
  const started=shownAt[r.n] || (state.round_started_at?new Date(state.round_started_at).getTime():Date.now());
  const ms=Math.min(Math.max(0,Date.now()-started), roundTimer(r)*1000);
  const correct = idx===r.answer_index;
  const points = scoreFor(correct, ms, roundTimer(r), r.mode);
  answers[r.n]={i:idx,correct,points,mode:r.mode}; LS.answers=answers;
  lastRenderKey=""; renderQuestion(); submitting=false;
  for(let k=0;k<4;k++){
    try{ const rr=await sbInsert("air_answers",{player_id:player.id,round:r.n,choice:String(idx),is_correct:correct,points,ms_taken:ms});
      if(rr.ok||rr.status===409) return; }catch(e){}
    await new Promise(x=>setTimeout(x,700));
  }
}

const TIMEOUT_PENALTY=-200;
async function submitTimeout(r){
  // ran out the clock with no answer at all — counts as wrong, with a fixed penalty
  answers[r.n]={i:null,correct:false,points:TIMEOUT_PENALTY,mode:r.mode,timeout:true}; LS.answers=answers;
  for(let k=0;k<4;k++){
    try{ const rr=await sbInsert("air_answers",{player_id:player.id,round:r.n,choice:"__timeout__",is_correct:false,points:TIMEOUT_PENALTY,ms_taken:roundTimer(r)*1000});
      if(rr.ok||rr.status===409) return; }catch(e){}
    await new Promise(x=>setTimeout(x,700));
  }
}

/* ---------- REVEAL ---------- */
function renderReveal(){
  const r=roundByN(state.current_round);
  if(!r){ renderLobby(); return; }
  const key="rev"+r.n; if(lastRenderKey===key) return; lastRenderKey=key;
  let a=answers[r.n];
  const correctLabel=pickLabel(r,r.answer_index);
  document.body.classList.remove("dead-screen");
  if(!a){
    submitTimeout(r);       // fire-and-forget: the local answer is set synchronously before any await
    a=answers[r.n];
  }
  if(a.timeout){
    const wipeout = (r.mode==="sudden_death");
    if(wipeout) document.body.classList.add("dead-screen");
    h(`<div class="card fade"><div class="pill">Round ${r.n} · Reveal</div>
        <div class="result-emoji">${wipeout?"💀":"⏱️"}</div>
        <div class="verdict ${wipeout?'dead':'bad'}">${wipeout?"Wiped out!":"Time's up"}</div>
        <p class="sub" style="margin-top:6px">You didn't answer in time. Correct answer: <b style="color:#fff">${esc(correctLabel)}</b>.</p>
        <div class="pts" style="color:#ff9a90">${a.points.toLocaleString()} pts</div>
        <div class="scorebar">Your score: <b>${myScore().toLocaleString()}</b></div></div>`);
    return;
  }
  const wipeout = (!a.correct && r.mode==="sudden_death");
  if(wipeout) document.body.classList.add("dead-screen");
  h(`<div class="card fade">
      <div class="pill">Round ${r.n} · Reveal</div>
      <div class="result-emoji">${a.correct?"✅":(wipeout?"💀":"❌")}</div>
      <div class="verdict ${a.correct?"good":(wipeout?"dead":"bad")}">${a.correct?"Correct!":(wipeout?"Wiped out!":"Not this time")}</div>
      <p class="sub" style="margin-top:4px">Answer: <b style="color:#fff">${esc(correctLabel)}</b>. You chose <b style="color:#fff">${esc(pickLabel(r,a.i))}</b>.</p>
      ${a.correct?`<div class="pts">+${a.points.toLocaleString()} pts${(r.mode==="blitz"||r.mode==="sudden_death")?" ⚡×1.5":""}</div>`:``}
      <div class="scorebar">Your score: <b>${myScore().toLocaleString()}</b></div></div>`);
}

function renderEnd(){
  if(lastRenderKey==="end") return; lastRenderKey="end";
  document.body.classList.remove("dead-screen");
  h(`<div class="card fade"><div class="result-emoji">🏆</div><div class="verdict good">That's a wrap!</div>
      <p class="sub" style="margin-top:6px">Final scores are on the big screen.</p>
      <div class="scorebar" style="margin-top:18px">You finished with</div>
      <div class="pts" style="font-size:34px;margin-top:2px">${myScore().toLocaleString()} pts</div>
      <p class="tiny" style="margin-top:18px">Thanks for playing, ${esc(player.name)}. You're a legend.</p></div>`);
}

function render(){
  if(!player){ renderJoin(); return; }
  switch(state.phase){
    case "question": renderQuestion(); break;
    case "reveal": renderReveal(); break;
    case "leaderboard": case "finished": renderEnd(); break;
    default: renderLobby();
  }
}

const conn=document.getElementById("conn"), connTxt=document.getElementById("connTxt");
let fails=0;
async function poll(){
  try{
    const rows=await sbGet("air_state?id=eq.1&select=phase,current_round,round_started_at,session_id");
    if(rows&&rows[0]){ const s=rows[0];
      if(player && s.session_id && player.session!==s.session_id){
        // host hit Reset (or this is stale data from a previous game) — forget this phone's identity and rejoin fresh
        forgetMe();
      }
      const changed=s.phase!==state.phase||s.current_round!==state.current_round||s.round_started_at!==state.round_started_at;
      state=s; if(changed) lastRenderKey=""; render(); }
    fails=0; conn.classList.remove("bad"); connTxt.textContent="live";
  }catch(e){ fails++; if(fails>=2){ conn.classList.add("bad"); connTxt.textContent="reconnecting"; } }
}
(async()=>{ await loadRounds(); render(); poll(); setInterval(poll,1500); })();
</script>
</body>
