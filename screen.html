<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI or Real — Big Screen (Futures)</title>
<style>
  :root{
    --bg1:#160a33; --bg2:#3a0f52; --bg3:#08041a;
    --ai:#7c5cff; --aiglow:#a78bfa;
    --real:#ff4d8d; --realglow:#ff8fb3;
    --gold:#ffd54a; --ink:#fff; --dim:rgba(255,255,255,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}
  body{background:radial-gradient(130% 110% at 50% -10%, var(--bg2) 0%, var(--bg1) 45%, var(--bg3) 100%)}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 5vw;text-align:center}
  .brandbar{position:fixed;top:3vh;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:1.5vh;opacity:.85}
  .brandbar .dot{width:1.4vh;height:1.4vh;border-radius:50%;background:linear-gradient(135deg,var(--ai),var(--real));box-shadow:0 0 16px var(--aiglow)}
  .grad{background:linear-gradient(100deg,var(--aiglow),var(--realglow));-webkit-background-clip:text;background-clip:text;color:transparent}
  .fade{animation:fade .5s ease}@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

  /* lobby */
  .lobby-title{font-size:10vh;font-weight:900;line-height:.98;letter-spacing:-.02em}
  .lobby-sub{font-size:3vh;color:var(--dim);margin-top:1.5vh}
  .qrbox{margin-top:3.5vh;background:#fff;padding:2.2vh;border-radius:2.4vh;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
  .qrbox img{display:block;width:34vh;height:34vh;image-rendering:pixelated}
  .joinurl{margin-top:2.4vh;font-size:3.2vh;font-weight:800;letter-spacing:.02em}
  .joinurl .u{background:rgba(255,255,255,.12);padding:.6vh 2vh;border-radius:1.4vh}
  .count{margin-top:3vh;font-size:4.6vh;font-weight:900;color:var(--gold)}
  .count small{font-size:2.4vh;color:var(--dim);font-weight:700;display:block;letter-spacing:.1em;text-transform:uppercase;margin-top:.4vh}

  /* question */
  .qhead{font-size:2.4vh;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:800}
  .qtitle{font-size:8.5vh;font-weight:900;line-height:1;margin:.4vh 0 2.4vh}
  .qcard{max-width:70vw}
  .qimg{max-height:56vh;max-width:78vw;border-radius:2vh;border:2px solid rgba(255,255,255,.14);box-shadow:0 24px 70px -24px rgba(0,0,0,.7)}
  .qstory{font-size:5.2vh;font-weight:700;line-height:1.32;max-width:62vw}
  .qmeta{display:flex;align-items:center;justify-content:center;gap:3vw;margin-top:3vh}
  .ring{position:relative;width:12vh;height:12vh}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5vh;font-weight:900}
  .votesin{font-size:3.4vh;font-weight:800;color:var(--dim)}
  .votesin b{color:#fff;font-size:5vh}
  .labelrow{position:fixed;bottom:12vh;left:0;right:0;display:flex;justify-content:center;gap:6vw;font-weight:900;font-size:3vh;opacity:.5}
  .labelrow .ai{color:var(--aiglow)}.labelrow .real{color:var(--realglow)}

  /* reveal */
  .stamp{font-size:16vh;font-weight:900;line-height:.9;letter-spacing:-.02em}
  .stamp.ai{color:var(--aiglow);text-shadow:0 0 40px rgba(124,92,255,.6)}
  .stamp.real{color:var(--realglow);text-shadow:0 0 40px rgba(255,77,141,.55)}
  .stamplbl{font-size:3vh;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:800}
  .revealfact{font-size:3.4vh;line-height:1.4;max-width:66vw;margin:2.5vh auto 0;color:#fff}
  .splitwrap{margin:3.4vh auto 0;width:66vw;max-width:900px}
  .splitbar{display:flex;height:6vh;border-radius:1.4vh;overflow:hidden;font-weight:900;font-size:2.6vh}
  .splitbar .sa{background:linear-gradient(160deg,#6b45ff,#3f1fb0);display:flex;align-items:center;justify-content:flex-start;padding-left:2vh;transition:width .8s cubic-bezier(.2,1,.3,1)}
  .splitbar .sr{background:linear-gradient(160deg,#ff4d8d,#c31e6a);display:flex;align-items:center;justify-content:flex-end;padding-right:2vh;transition:width .8s cubic-bezier(.2,1,.3,1)}
  .splitlbls{display:flex;justify-content:space-between;margin-top:1vh;font-size:2.2vh;color:var(--dim);font-weight:700}
  .gotright{margin-top:2.4vh;font-size:3vh;font-weight:800;color:var(--gold)}

  /* leaderboard */
  .lbtitle{font-size:8vh;font-weight:900;margin-bottom:3vh}
  .lb{width:60vw;max-width:820px}
  .row{display:flex;align-items:center;gap:2vw;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:1.6vh;padding:1.6vh 2.4vh;margin-bottom:1.4vh;font-size:3.4vh;font-weight:800}
  .row .rk{width:6vh;text-align:center;font-weight:900;color:var(--dim)}
  .row .nm{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sc{color:var(--gold);font-weight:900}
  .row.top1{background:linear-gradient(100deg,rgba(255,213,74,.22),rgba(255,255,255,.06));border-color:rgba(255,213,74,.5);transform:scale(1.03)}
  .row.top1 .rk{color:var(--gold)}
  .winner{font-size:5vh;font-weight:900;margin-bottom:2vh}
  .confetti{font-size:9vh}

  /* control bar */
  #ctrl{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(8,4,20,.82);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.1);z-index:50;transition:transform .25s}
  #ctrl.hidden{transform:translateY(110%)}
  #ctrl .status{font-size:13px;color:var(--dim);font-weight:700;letter-spacing:.04em;min-width:190px}
  #ctrl .status b{color:#fff}
  .cbtn{padding:11px 20px;border:none;border-radius:11px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;background:rgba(255,255,255,.12)}
  .cbtn.primary{background:linear-gradient(100deg,var(--ai),var(--real));box-shadow:0 8px 24px -8px var(--ai)}
  .cbtn.warn{background:rgba(255,80,80,.22);color:#ffb3b3}
  .cbtn:active{transform:scale(.97)}
  .spacer{flex:1}
  .hint{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.03em}
</style>
</head>
<body>
<div class="brandbar"><span class="dot"></span> Futures Dream Team · AI or Real</div>
<div id="stage"></div>

<div id="ctrl">
  <div class="status" id="status">—</div>
  <button class="cbtn primary" id="btnNext">Start ▶</button>
  <button class="cbtn" id="btnReveal">Reveal</button>
  <button class="cbtn" id="btnBoard">Leaderboard</button>
  <div class="spacer"></div>
  <div class="hint">Space/→ advance · R reveal · L board · H hide bar</div>
  <button class="cbtn warn" id="btnReset">Reset</button>
</div>

<script src="config.js"></script>
<script>
const H={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};
async function sbGet(p){const r=await fetch(SUPABASE_URL+"/rest/v1/"+p,{headers:H});if(!r.ok)throw 0;return r.json();}
async function sbRpc(fn,b){const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:H,body:JSON.stringify(b||{})});if(!r.ok)throw 0;return r.json();}
async function setState(patch){
  patch.updated_at=new Date().toISOString();
  await fetch(SUPABASE_URL+"/rest/v1/air_state?id=eq.1",{method:"PATCH",headers:{...H,"Prefer":"return=minimal"},body:JSON.stringify(patch)});
}

const JOIN_URL = (typeof PLAYER_URL!=="undefined" && PLAYER_URL) ? PLAYER_URL : (location.origin+"/");
const stage=document.getElementById("stage");
const statusEl=document.getElementById("status");
let state={phase:"lobby",current_round:0,round_started_at:null};
let renderKey="";
const roundByN=n=>ROUNDS.find(r=>r.n===n);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- RENDER ---------------- */
async function render(){
  const r=roundByN(state.current_round);
  const key=state.phase+"|"+state.current_round;
  const dynamic = state.phase==="question"||state.phase==="reveal"||state.phase==="lobby"||state.phase==="leaderboard";
  if(key===renderKey && !dynamic) return;

  if(state.phase==="lobby"){ if(renderKey!==key){renderLobby();renderKey=key;} refreshLobby(); }
  else if(state.phase==="question"){ if(renderKey!==key){renderQuestion(r);renderKey=key;} refreshQuestion(r); }
  else if(state.phase==="reveal"){ if(renderKey!==key){renderReveal(r);renderKey=key;} }
  else if(state.phase==="leaderboard"||state.phase==="finished"){ if(renderKey!==key){renderBoard();renderKey=key;} }
  updateStatus();
}

function renderLobby(){
  stage.innerHTML=`
    <div class="fade">
      <div class="lobby-title">AI or <span class="grad">Real?</span></div>
      <div class="lobby-sub">Scan the code, add your name, and beat the crowd.</div>
      <div class="qrbox pop"><img src="https://api.qrserver.com/v1/create-qr-code/?size=460x460&margin=8&data=${encodeURIComponent(JOIN_URL)}" alt="Scan to play" onerror="this.style.display='none'"></div>
      <div class="joinurl">📲 &nbsp;<span class="u">Point your phone camera at the code</span></div>
      <div class="count"><span id="pc">0</span><small>players in</small></div>
    </div>`;
}
async function refreshLobby(){
  try{const c=await sbRpc("air_player_count");const el=document.getElementById("pc");if(el)el.textContent=Number(c).toLocaleString();}catch(e){}
}

function ringSVG(){
  return `<div class="ring"><svg width="100%" height="100%" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="9"/>
    <circle id="rc" cx="50" cy="50" r="44" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="276.5" stroke-dashoffset="0"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff8fb3"/></linearGradient></defs>
    </svg><div class="num" id="rnum">${TIMER_SECONDS}</div></div>`;
}
function renderQuestion(r){
  if(!r){stage.innerHTML="";return;}
  const body = r.type==="image"
    ? `<img class="qimg pop" src="${r.img}" alt="Round ${r.n}" onerror="this.replaceWith(document.createTextNode('[image ${r.n}]'))">`
    : `<div class="qstory pop">“${esc(r.text)}”</div>`;
  stage.innerHTML=`
    <div class="fade" style="width:100%;display:flex;flex-direction:column;align-items:center">
      <div class="qhead">Round ${r.n} of ${ROUNDS.length} · ${esc(r.label)}</div>
      <div class="qtitle">AI or <span class="grad">Real?</span></div>
      <div class="qcard">${body}</div>
      <div class="qmeta">
        ${ringSVG()}
        <div class="votesin"><b id="vin">0</b> votes in</div>
      </div>
    </div>
    <div class="labelrow"><div class="ai">← think AI?</div><div class="real">think REAL? →</div></div>`;
}
function refreshQuestion(r){
  // countdown ring
  const started=state.round_started_at?new Date(state.round_started_at).getTime():Date.now();
  const total=TIMER_SECONDS*1000, left=Math.max(0,total-(Date.now()-started));
  const num=document.getElementById("rnum"), rc=document.getElementById("rc");
  if(num) num.textContent=Math.ceil(left/1000);
  if(rc){ const frac=left/total; rc.style.strokeDashoffset=(276.5*(1-frac)).toFixed(1); }
  // live votes
  sbRpc("air_round_tally",{r:state.current_round}).then(t=>{
    const row=Array.isArray(t)?t[0]:t; const el=document.getElementById("vin");
    if(el&&row) el.textContent=Number(row.total).toLocaleString();
  }).catch(()=>{});
}

async function renderReveal(r){
  if(!r){stage.innerHTML="";return;}
  let t={ai_count:0,real_count:0,correct_count:0,total:0};
  try{const res=await sbRpc("air_round_tally",{r:r.n});t=(Array.isArray(res)?res[0]:res)||t;}catch(e){}
  const ai=Number(t.ai_count)||0, real=Number(t.real_count)||0, tot=ai+real||1;
  const aiPct=Math.round(ai/tot*100), realPct=100-aiPct;
  const correct=Number(t.correct_count)||0, total=Number(t.total)||0;
  const isAi=r.answer==="ai";
  stage.innerHTML=`
    <div class="fade" style="width:100%;display:flex;flex-direction:column;align-items:center">
      <div class="stamplbl">The answer is…</div>
      <div class="stamp ${r.answer} pop">${r.answer.toUpperCase()}</div>
      <div class="revealfact">${esc(r.reveal)}</div>
      <div class="splitwrap">
        <div class="splitbar">
          <div class="sa" style="width:${aiPct}%">${aiPct>10?aiPct+"% AI":""}</div>
          <div class="sr" style="width:${realPct}%">${realPct>10?realPct+"% REAL":""}</div>
        </div>
        <div class="splitlbls"><span>${ai.toLocaleString()} said AI</span><span>${real.toLocaleString()} said REAL</span></div>
      </div>
      <div class="gotright">🎯 ${correct.toLocaleString()} of ${total.toLocaleString()} nailed it</div>
    </div>`;
}

async function renderBoard(){
  let rows=[];
  try{rows=await sbRpc("air_leaderboard",{limit_n:10});}catch(e){}
  const medal=i=>["🥇","🥈","🥉"][i]||(i+1);
  const winner=rows[0];
  const finished=state.phase==="finished";
  stage.innerHTML=`
    <div class="fade" style="width:100%;display:flex;flex-direction:column;align-items:center">
      ${finished&&winner?`<div class="confetti pop">🎉</div><div class="winner">🏆 ${esc(winner.name)} wins!</div>`:`<div class="lbtitle">🏆 Leaderboard</div>`}
      <div class="lb">
        ${rows.length?rows.map((r,i)=>`
          <div class="row ${i===0?'top1':''}">
            <div class="rk">${medal(i)}</div>
            <div class="nm">${esc(r.name)}</div>
            <div class="sc">${Number(r.score).toLocaleString()}</div>
          </div>`).join(""):`<div class="lobby-sub">Scores will appear here…</div>`}
      </div>
    </div>`;
}

/* ---------------- CONTROLS ---------------- */
function updateStatus(){
  const map={lobby:"Lobby (players joining)",question:"Question OPEN",reveal:"Reveal shown",leaderboard:"Leaderboard",finished:"Finished"};
  statusEl.innerHTML=`Phase: <b>${map[state.phase]||state.phase}</b>${state.current_round?` · Round <b>${state.current_round}/${ROUNDS.length}</b>`:""}`;
  const nb=document.getElementById("btnNext");
  if(state.phase==="lobby") nb.textContent="Start ▶";
  else if(state.phase==="question") nb.textContent="Reveal ▶";
  else if(state.phase==="reveal") nb.textContent=(state.current_round<ROUNDS.length)?"Next round ▶":"Show leaderboard ▶";
  else if(state.phase==="leaderboard") nb.textContent="Crown winner ▶";
  else nb.textContent="—";
}
async function advance(){
  const p=state.phase, n=state.current_round;
  if(p==="lobby"){ await setState({phase:"question",current_round:1,round_started_at:new Date().toISOString()}); }
  else if(p==="question"){ await setState({phase:"reveal"}); }
  else if(p==="reveal"){
    if(n<ROUNDS.length) await setState({phase:"question",current_round:n+1,round_started_at:new Date().toISOString()});
    else await setState({phase:"leaderboard"});
  }
  else if(p==="leaderboard"){ await setState({phase:"finished"}); }
  await poll();
}
async function doReveal(){ if(state.phase==="question"){ await setState({phase:"reveal"}); await poll(); } }
async function doBoard(){ await setState({phase:"leaderboard"}); await poll(); }

let resetArmed=false;
document.getElementById("btnNext").onclick=advance;
document.getElementById("btnReveal").onclick=doReveal;
document.getElementById("btnBoard").onclick=doBoard;
document.getElementById("btnReset").onclick=async(e)=>{
  const b=e.target;
  if(!resetArmed){ resetArmed=true; b.textContent="Sure? Tap again"; setTimeout(()=>{resetArmed=false;b.textContent="Reset";},3000); return; }
  resetArmed=false; b.textContent="Reset";
  await sbRpc("air_reset"); renderKey=""; await poll();
};
document.addEventListener("keydown",e=>{
  if(e.key===" "||e.key==="ArrowRight"){ e.preventDefault(); advance(); }
  else if(e.key.toLowerCase()==="r"){ doReveal(); }
  else if(e.key.toLowerCase()==="l"){ doBoard(); }
  else if(e.key.toLowerCase()==="h"){ document.getElementById("ctrl").classList.toggle("hidden"); }
});

/* ---------------- POLL LOOP ---------------- */
async function poll(){
  try{
    const rows=await sbGet("air_state?id=eq.1&select=phase,current_round,round_started_at");
    if(rows&&rows[0]) state=rows[0];
  }catch(e){}
  render();
}
render(); poll();
setInterval(poll, 1200);
</script>
</body>
</html>
